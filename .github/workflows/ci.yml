
name: CivicFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore PublicServiceCaseManagement.sln

      - name: Build solution
        run: dotnet build PublicServiceCaseManagement.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test PublicServiceCaseManagement.sln --configuration Release --no-build --verbosity normal
