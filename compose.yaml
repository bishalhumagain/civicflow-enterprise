services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicflow
      POSTGRES_USER: civicflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CIVICFLOW_RUNTIME_PASSWORD: ${CIVICFLOW_RUNTIME_PASSWORD:?Set CIVICFLOW_RUNTIME_PASSWORD in .env}
      CIVICFLOW_MIGRATOR_PASSWORD: ${CIVICFLOW_MIGRATOR_PASSWORD:?Set CIVICFLOW_MIGRATOR_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow_admin -d civicflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - civicflow_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: .
      dockerfile: PublicServiceCaseManagement.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__CivicFlow: "Host=postgres;Port=5432;Database=civicflow;Username=civicflow_runtime;Password=${CIVICFLOW_RUNTIME_PASSWORD}"
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:5173}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME:-CivicFlow}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      Invitations__ExpiryHours: ${INVITATION_EXPIRY_HOURS:-72}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./PublicServiceCaseManagement.Api/App_Data:/app/App_Data

  frontend:
    build:
      context: ./civicflow-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  civicflow_postgres_data:
