
services:
  postgres:
    image: postgres:17
    container_name: civicflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicflow
      POSTGRES_USER: civicflow_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - civicflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow_app -d civicflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civicflow_postgres_data:
