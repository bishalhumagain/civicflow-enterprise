services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicflow
      POSTGRES_USER: civicflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CIVICFLOW_RUNTIME_PASSWORD: ${CIVICFLOW_RUNTIME_PASSWORD:?Set CIVICFLOW_RUNTIME_PASSWORD in .env}
      CIVICFLOW_MIGRATOR_PASSWORD: ${CIVICFLOW_MIGRATOR_PASSWORD:?Set CIVICFLOW_MIGRATOR_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow_admin -d civicflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - civicflow_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  civicflow_postgres_data:
